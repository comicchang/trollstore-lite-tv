name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck（warning 级别即失败）
        run: |
          files=$(git ls-files '*.sh' 'src/cli/tsltv' 'src/daemon/tsltvd' 'src/fork/tsh' \
                             'scripts/*.sh' 'src/*/build.sh' 'examples/*/build.sh' 'tests/*.sh' | sort -u)
          echo "检查文件："; echo "$files"
          shellcheck -S warning -f gcc $files
      - name: 脚本必须可执行
        run: |
          fail=0
          for f in src/cli/tsltv src/daemon/tsltvd src/daemon/retrust.sh src/fork/tsh \
                   scripts/*.sh src/*/build.sh examples/*/build.sh tests/*.sh; do
            [ -x "$f" ] || { echo "缺少可执行位: $f"; fail=1; }
          done
          exit $fail
      - name: 不允许 CRLF
        run: |
          if git grep -Il $'\r' -- '*.sh' 'src/**' 'scripts/**' 'tests/**'; then
            echo "发现 CRLF 换行"; exit 1
          fi
          echo OK

  test:
    name: 单元测试（macOS + tvOS SDK）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 环境信息
        run: |
          xcodebuild -version || true
          xcrun --sdk appletvos --show-sdk-path || true
      - name: 运行测试
        run: ./tests/run.sh -v
      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ipa
          path: dist/TSLTVDemo-unsigned.ipa
          if-no-files-found: ignore

  package:
    name: 打包 .deb
    runs-on: macos-14
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 dpkg
        run: brew install dpkg
      - name: 构建
        run: ./scripts/build-deb-local.sh
      - name: 校验包内容
        run: |
          deb=$(ls dist/*.deb | head -1)
          echo "产物: $deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'tsltv$|TSLTV.app/TSLTV|\.plist' | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    name: 发布（tag 触发）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: [package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 dpkg
        run: brew install dpkg
      - name: 构建安装包与 demo ipa
        run: |
          ./scripts/build-deb-local.sh
          ./examples/hello-tvos/build.sh
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: TrollStore Lite TV ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/TSLTVDemo-unsigned.ipa
