name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck（warning 级别即失败）
        run: |
          files=$(git ls-files '*.sh' 'src/cli/tsltv' 'src/daemon/tsltvd' 'src/fork/tsh' | sort -u)
          echo "检查文件："; echo "$files"
          shellcheck -S warning -f gcc $files
      - name: 脚本必须可执行
        run: |
          fail=0
          for f in src/cli/tsltv src/daemon/tsltvd src/daemon/retrust.sh src/fork/tsh \
                   scripts/*.sh src/*/build.sh examples/*/build.sh tests/*.sh; do
            [ -x "$f" ] || { echo "缺少可执行位: $f"; fail=1; }
          done
          exit $fail
      - name: 不允许 CRLF
        run: |
          if git grep -Il $'\r' -- '*.sh' 'src' 'scripts' 'tests' 'examples'; then
            echo "发现 CRLF 换行"; exit 1
          fi
          echo OK

  # Linux 上是"不依赖 tvOS SDK"的那部分：语法 / plist / 用法 / 注入拦截 / 预检判定。
  # 需要 SDK 的 Mach-O 解析与 demo ipa 构建会自动跳过（见 tests/run.sh）。
  test:
    name: 单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行测试
        run: ./tests/run.sh -v

  # macOS 跑完整测试与打包。若账号没有可用的 macOS runner 分钟，这两个 job 会被
  # 取消——它们不阻塞 CI 结论，本地用 scripts/build-deb-local.sh 出包即可。
  test-macos:
    name: 完整测试（macOS + tvOS SDK）
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 环境信息
        run: |
          xcodebuild -version || true
          xcrun --sdk appletvos --show-sdk-path || true
      - name: 运行测试
        run: ./tests/run.sh -v

  package:
    name: 打包 .deb（macOS）
    runs-on: macos-14
    continue-on-error: true
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 dpkg
        run: brew install dpkg
      - name: 构建
        run: ./scripts/build-deb-local.sh
      - name: 校验包内容
        run: |
          deb=$(ls dist/*.deb | head -1)
          echo "产物: $deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'tsltv$|TSLTV.app/TSLTV|\.plist' | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: ignore
