name: Feature Request
description: Propose an improvement for TrollStore Lite TV
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verification Plan
      description: How can this be verified offline in tests/run.sh and on device?
    validations:
      required: true
